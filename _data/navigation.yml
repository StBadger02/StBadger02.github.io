# The following is the order of the links in the header of the website.
#
# Changing the order here will adjust the order and you can also add additional
# links. Removing a link prevents it from showing in the header, but does not
# prevent it from being included in the site.

main:
  - title: "Publications"
    url: /publications/

  - title: "Projects"
    url: /projects/

  - title: "Talks"
    url: /talks/

  - title: "Courses"
    url: /cr/

  # Stable URL on purpose: overwrite files/cv.pdf when the CV changes, never rename it.
  # Dated filenames created a new 404 in Search Console with every update.
  - title: "CV"
    url: /files/cv.pdf
